{% extends "base.html" %}
{% block title %}Edit recipe{% endblock %}
{% block content %}
<div class="form-card form-card-wide">
    <h1>Edit recipe</h1>
    <form method="POST">
        <label for="name">Recipe name</label>
        <input type="text" id="name" name="name" value="{{ recipe.name }}" required autofocus>

        <label for="servings">Servings</label>
        <input type="number" step="1" min="1" id="servings" name="servings" value="{{ recipe.servings }}" required>

        <p class="hint">Enter calories and macros for <strong>one serving</strong>.</p>

        <label for="calories">Calories (per serving)</label>
        <input type="number" step="1" min="1" id="calories" name="calories" value="{{ recipe.calories }}" required>

        <label for="protein_g">Protein (g, per serving)</label>
        <input type="number" step="0.1" min="0" id="protein_g" name="protein_g" value="{{ recipe.protein_g }}" required>

        <label for="carbs_g">Carbs (g, per serving)</label>
        <input type="number" step="0.1" min="0" id="carbs_g" name="carbs_g" value="{{ recipe.carbs_g }}" required>

        <label for="fat_g">Fat (g, per serving)</label>
        <input type="number" step="0.1" min="0" id="fat_g" name="fat_g" value="{{ recipe.fat_g }}" required>

        <label for="ingredients">Ingredients (whole recipe, one per line)</label>
        <textarea id="ingredients" name="ingredients" rows="6" required>{{ ingredients_text }}</textarea>
        <p class="hint">Format: <code>name, quantity, unit</code> &mdash; one ingredient per line.</p>

        <button type="submit" class="btn btn-primary">Save changes</button>
        <a href="{{ url_for('recipes') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
